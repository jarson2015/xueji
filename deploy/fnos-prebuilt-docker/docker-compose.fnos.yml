# 学迹 · 预编译包 Docker（无 heredoc，避免 unterminated quoted string）
# 工作目录：/vol1/1000/www/xueji
#
# 必须是「文件」不是目录：
#   nginx-web.conf
#   api/docker-start.sh
# 若曾被 Docker 建成空目录：
#   rm -rf nginx-web.conf nginx.conf
#   再重新上传这两个文件
#
#   docker compose -f docker-compose.fnos.yml --env-file .env up -d

services:
  api:
    image: node:20-bookworm-slim
    container_name: study-api
    restart: unless-stopped
    working_dir: /app
    env_file:
      - .env
    environment:
      PORT: "3000"
      NODE_ENV: production
      DB_TYPE: mysql
      DB_HOST: ${XUEJI_DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-study}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-study_checkin}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      TZ: ${TZ:-Asia/Shanghai}
      UPLOAD_DIR: uploads
      CORS_ORIGIN: ${CORS_ORIGIN}
      RUN_SEED_ON_START: ${RUN_SEED_ON_START:-false}
      ENABLE_DEMO_HINTS: ${ENABLE_DEMO_HINTS:-false}
      DB_SYNCHRONIZE: "false"
      DB_MIGRATIONS_RUN: ${DB_MIGRATIONS_RUN:-false}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:study@localhost}
      npm_config_registry: https://registry.npmmirror.com
    volumes:
      - /vol1/1000/www/xueji/api:/app
      - /vol1/1000/www/xueji/data/uploads:/app/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3000:3000"
    command: ["sh", "/app/docker-start.sh"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 120s

  web:
    image: nginx:alpine
    container_name: study-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"
    user: "0:0"
    volumes:
      - /vol1/1000/www/xueji/web:/usr/share/nginx/html:ro
      - /vol1/1000/www/xueji/nginx-web.conf:/etc/nginx/conf.d/default.conf:ro
    # 单行命令，无 heredoc / 无复杂引号
    command:
      - sh
      - -c
      - sed -i 's/^user  nginx;/user  root;/' /etc/nginx/nginx.conf; exec nginx -g 'daemon off;'
