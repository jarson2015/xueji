services:
  mysql:
    image: mysql:8.0
    container_name: study-mysql
    restart: unless-stopped
    environment:
      # Override via .env (see .env.compose.example). Do not ship defaults to the public internet.
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-study_checkin}
      MYSQL_USER: ${MYSQL_USER:-study}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u$$MYSQL_USER -p$$MYSQL_PASSWORD || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./apps/api
    container_name: study-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: 3000
      NODE_ENV: production
      DB_TYPE: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER:-study}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      DB_NAME: ${MYSQL_DATABASE:-study_checkin}
      JWT_SECRET: ${JWT_SECRET:?Set a strong JWT_SECRET (>=24 chars, unique)}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      TZ: Asia/Shanghai
      UPLOAD_DIR: uploads
      # Comma-separated frontend origins only (required in production)
      CORS_ORIGIN: ${CORS_ORIGIN:?Set CORS_ORIGIN e.g. https://your.domain}
      # Production default: do NOT auto-seed demo accounts
      RUN_SEED_ON_START: ${RUN_SEED_ON_START:-false}
      ENABLE_DEMO_HINTS: ${ENABLE_DEMO_HINTS:-false}
      DB_SYNCHRONIZE: "false"
      DB_MIGRATIONS_RUN: "true"
      # Generate: npx web-push generate-vapid-keys
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@localhost}
    ports:
      - "3000:3000"
    volumes:
      - api_uploads:/app/uploads
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  web:
    build: ./apps/web
    container_name: study-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1/ || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mysql_data:
  api_uploads:
